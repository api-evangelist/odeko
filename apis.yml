name: Odeko
description: >-
  Odeko is a cafe operations platform that keeps independent coffee shops and
  cafes stocked by combining predictive ordering, overnight supply delivery,
  and mobile ordering plus rewards management through a single dashboard. It
  was surfaced as a portfolio company of GGV Capital and Y Combinator and added
  to the API Evangelist network. Odeko publishes no first-party developer API;
  its public odeko.com storefront runs on Shopify, which provisions
  agentic-commerce surfaces (llms.txt, UCP profile, and a UCP shopping MCP
  endpoint) on the domain. This profile captures those real domain artifacts.
